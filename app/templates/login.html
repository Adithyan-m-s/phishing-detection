<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | PhishShield</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container" style="display: flex; align-items: center; justify-content: center;">
        <div class="glass-card" style="padding: 3rem; width: 100%; max-width: 400px; text-align: center;">
            <h1 style="font-size: 2rem; margin-bottom: 2rem;">Admin Access</h1>

            {% if error %}
            <p style="color: var(--danger); margin-bottom: 1rem;">{{ error }}</p>
            {% endif %}

            <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required style="
                    background: rgba(15, 23, 42, 0.8);
                    border: 2px solid rgba(255, 255, 255, 0.1);
                    border-radius: 12px;
                    padding: 1.2rem 1.5rem;
                    color: white;
                ">
                <button type="submit" style="height: 60px;">LOG IN</button>
            </form>
            <br>
            <a href="{{ url_for('home') }}" style="color: var(--text-muted); text-decoration: none;">Back to Home</a>
        </div>
    </div>
</body>

</html>
